<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyScoop browser tests</title>
    <style>
      :root {
        --primary-color: #347f78;
        --warning-color: #b26a23;
        --error-color: #b44848;
        --info-color: #477caa;
        --ha-card-background: #fff;
        --card-background-color: #fff;
        --primary-text-color: #202927;
        --secondary-text-color: #64716f;
        --secondary-background-color: #eaf1ef;
        --divider-color: rgba(90, 110, 105, 0.2);
        --ha-card-border-radius: 12px;
      }
      body { margin: 16px; font-family: sans-serif; background: #f3f5f4; color: #202927; }
      ha-card { display: block; border: 1px solid #dce2df; }
    </style>
    <script>
      customElements.define("ha-card", class extends HTMLElement {
        constructor() {
          super();
          this.attachShadow({ mode: "open" }).innerHTML = '<style>h2 { padding: 16px 16px 0; margin: 0; font-size: 18px; font-weight: 500; }</style><h2></h2><slot></slot>';
        }
        set header(value) { this.shadowRoot.querySelector("h2").textContent = value; }
      });
      customElements.define("ha-icon", class extends HTMLElement {
        static get observedAttributes() { return ["icon"]; }
        constructor() {
          super();
          this.attachShadow({ mode: "open" }).innerHTML = '<style>:host { display: inline-block; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px); vertical-align: middle; } svg { display: block; width: 100%; height: 100%; fill: currentColor; }</style><svg viewBox="0 0 24 24" aria-hidden="true"><path></path></svg>';
        }
        set icon(value) {
          this.shadowRoot.querySelector("path").setAttribute("d", window.skyscoopTestIcons?.[value] ?? "");
        }
        attributeChangedCallback(_name, _old, value) { this.icon = value; }
      });
    </script>
    <script type="module" src="/skyscoop-card.js"></script>
  </head>
  <body></body>
</html>
